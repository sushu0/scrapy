name: Validate nested empty item export
on:
  push:
    branches:
      - codex/validate-nested-empty-export
permissions:
  contents: read
jobs:
  mypy-and-exporters:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_PYTHON_PREFERENCE: only-system
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2f4ae83cc45e03c2dec490a1e48b0dfbf69ac5d2
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - name: Verify fixed candidate
        run: test "$(git rev-parse HEAD)" = 2f4ae83cc45e03c2dec490a1e48b0dfbf69ac5d2
      - name: Run project type checks
        run: uvx --with tox-uv tox -e mypy
      - name: Run exporter tests on the candidate
        run: uvx --with tox-uv tox -e py -- tests/test_exporters.py